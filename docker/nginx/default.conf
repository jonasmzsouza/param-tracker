server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files from /usr/share/nginx/html
    location / {
        try_files $uri $uri/ =404;
    }

    # Serve the built 'dist' directory (dev override mounts it to /usr/share/nginx/html_dist)
    location /dist/ {
        alias /usr/share/nginx/html_dist/;
        try_files $uri $uri/ =404;
    }

    # Optional security headers (dev-friendly)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
}
