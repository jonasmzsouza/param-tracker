<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParamTracker Demo — Page 3</title>
  </head>
  <body>
    <h1>ParamTracker Demo - Page 3</h1>
    <p>
      This is the <strong>Page 3</strong>. If you arrived here without tracking parameters, this
      confirms that the tracker is working as expected.
    </p>

    <!-- Helpers -->
    <hr />
    <div><em>Current URL parameters: </em><span id="params"></span></div>
    <hr />

    <button onclick="goBack()">← Back to Previous Page</button>

    <script>
      document.getElementById('params').textContent = window.location.search
        ? window.location.search
        : 'None';
      function goBack() {
        if (window.history.length > 1) {
          window.history.back();
        } else {
          window.location.href = '/demos';
        }
      }
    </script>
  </body>
</html>
